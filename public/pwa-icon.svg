<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Premium Dark Navy Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141836"/>
      <stop offset="50%" stop-color="#0F1124"/>
      <stop offset="100%" stop-color="#080914"/>
    </linearGradient>

    <!-- Electric Amber-Gold to Crimson Lightning Gradient -->
    <linearGradient id="boltGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFF5B8"/>
      <stop offset="25%" stop-color="#FFD000"/>
      <stop offset="65%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#E0183D"/>
    </linearGradient>

    <!-- Electric Core Glow Highlight -->
    <linearGradient id="boltHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#FFE600" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </linearGradient>

    <!-- Energy Ring Outer Glow -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0183D" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Shadow for 3D depth -->
    <filter id="boltGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#F59E0B" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#E0183D" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0F1124" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle Ambient Radial Energy in Center -->
  <circle cx="256" cy="256" r="230" fill="url(#ambientGlow)"/>

  <!-- Outer Tech Border Ring -->
  <rect x="20" y="20" width="472" height="472" rx="96" fill="none" stroke="url(#ringGrad)" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Geometric Electrical Spark Accents -->
  <!-- Top Right Energy Spark -->
  <polygon points="380,105 390,125 410,135 390,145 380,165 370,145 350,135 370,125" fill="#FFD000" opacity="0.8"/>
  <circle cx="380" cy="135" r="3" fill="#FFFFFF"/>

  <!-- Bottom Left Energy Spark -->
  <polygon points="120,360 128,375 145,382 128,390 120,405 112,390 95,382 112,375" fill="#E0183D" opacity="0.7"/>

  <!-- Main Electric Lightning Bolt (बिजली का निशान) -->
  <g filter="url(#boltGlow)">
    <!-- Primary Bolt Body -->
    <path d="M 292 64 
             L 168 258 
             L 252 258 
             L 214 448 
             L 364 218 
             L 276 218 
             Z" 
          fill="url(#boltGrad)" 
          stroke="#FFF5B8" 
          stroke-width="3" 
          stroke-linejoin="round"/>

    <!-- Specular Bevel (Split Light Edge for 3D look) -->
    <path d="M 292 64 
             L 168 258 
             L 252 258 
             L 230 365 
             L 248 238 
             L 205 238 
             L 282 82 
             Z" 
          fill="url(#boltHighlight)"/>
  </g>

  <!-- Brand Label Subtle Badge at Bottom -->
  <g opacity="0.9">
    <text x="256" y="476" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
          font-size="28" 
          font-weight="900" 
          letter-spacing="5" 
          fill="#E2E8F0" 
          text-anchor="middle">FALCON</text>
  </g>
</svg>
