<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="maskBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141836"/>
      <stop offset="50%" stop-color="#0F1124"/>
      <stop offset="100%" stop-color="#080914"/>
    </linearGradient>

    <linearGradient id="boltGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFF5B8"/>
      <stop offset="25%" stop-color="#FFD000"/>
      <stop offset="65%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#E0183D"/>
    </linearGradient>

    <linearGradient id="boltHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#FFE600" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </linearGradient>

    <filter id="boltGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#F59E0B" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#E0183D" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0F1124" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Full edge-to-edge background for maskable container -->
  <rect width="512" height="512" fill="url(#maskBg)"/>

  <!-- Ambient Glow centered inside safe zone -->
  <circle cx="256" cy="256" r="190" fill="url(#ambientGlow)"/>

  <!-- Scaled Lightning Bolt (Scaled to ~72% to fit comfortably inside the 80% Android Maskable Circle) -->
  <g transform="translate(256, 240) scale(0.72) translate(-256, -240)">
    <!-- Small sparks -->
    <polygon points="370,110 380,128 398,137 380,146 370,164 361,146 343,137 361,128" fill="#FFD000" opacity="0.85"/>
    <polygon points="135,350 142,362 156,368 142,374 135,386 128,374 114,368 128,362" fill="#E0183D" opacity="0.75"/>

    <g filter="url(#boltGlow)">
      <path d="M 292 64 
               L 168 258 
               L 252 258 
               L 214 448 
               L 364 218 
               L 276 218 
               Z" 
            fill="url(#boltGrad)" 
            stroke="#FFF5B8" 
            stroke-width="3" 
            stroke-linejoin="round"/>

      <path d="M 292 64 
               L 168 258 
               L 252 258 
               L 230 365 
               L 248 238 
               L 205 238 
               L 282 82 
               Z" 
            fill="url(#boltHighlight)"/>
    </g>

    <!-- FALCON text in safe zone -->
    <text x="256" y="476" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
          font-size="32" 
          font-weight="900" 
          letter-spacing="6" 
          fill="#E2E8F0" 
          text-anchor="middle">FALCON</text>
  </g>
</svg>
